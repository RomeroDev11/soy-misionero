<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pequeños Misioneros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@400;700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Plan: un solo mundo visual, el vitral de una iglesia de noche.
   Fondo azul noche, piezas de vidrio de colores con borde de plomo,
   tarjetas claras tipo pergamino para leer. Una columna, pensada para celular. */
:root{
  color-scheme: dark;
  --noche:#15173f;
  --noche-2:#23276a;
  --plomo:#0a0b22;
  --oro:#f6c445;
  --rubi:#e2455f;
  --esmeralda:#2fbf8f;
  --cielo:#58b7f0;
  --violeta:#9b6bf2;
  --pergamino:#fff5dc;
  --tinta:#1b1c44;
  --tenue:#aab0e6;
  --display:"Grandstander","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--noche);
  background-image:radial-gradient(120% 60% at 50% 0%, #3a3fa0 0%, var(--noche-2) 40%, var(--noche) 100%);
  color:var(--pergamino);
  font-family:var(--body);
  font-size:17px;
  line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--cielo);outline-offset:3px}

/* Botones */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:54px;padding:10px 22px;width:100%;
  font-family:var(--display);font-weight:800;font-size:1.15rem;
  background:var(--oro);color:var(--tinta);
  border:4px solid var(--plomo);border-bottom-width:8px;border-radius:18px;
}
.btn:active{transform:translateY(3px);border-bottom-width:5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--noche-2);color:var(--pergamino)}
.btn.chico{min-height:44px;width:auto;font-size:1rem;padding:6px 16px}

/* Tarjeta pergamino */
.hoja{background:var(--pergamino);color:var(--tinta);border:4px solid var(--plomo);border-radius:20px;padding:16px}
.pila{display:flex;flex-direction:column;gap:16px}

/* Inicio */
.titulo{font-size:2.5rem;font-weight:800;color:var(--oro);text-shadow:0 4px 0 var(--plomo);text-align:center;margin-top:8px}
.sub{text-align:center;color:var(--tenue);font-weight:700}
.vitral{display:flex;justify-content:center;margin:4px 0}
label.campo{font-family:var(--display);font-weight:600;font-size:1.1rem;display:block;margin-bottom:6px}
input[type=text]{
  width:100%;min-height:54px;padding:8px 14px;font:inherit;font-weight:800;font-size:1.2rem;
  color:var(--tinta);background:#fff;border:4px solid var(--plomo);border-radius:14px;
}
.colores{display:flex;gap:12px;flex-wrap:wrap}
.color{width:50px;height:50px;border-radius:50%;border:4px solid var(--plomo)}
.color[aria-pressed=true]{outline:4px solid var(--tinta);outline-offset:3px}

/* Barra superior */
.barra{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--plomo);border-bottom:3px solid var(--oro)}
.barra .quien{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:1.1rem;overflow-wrap:anywhere}
.barra .est{color:var(--oro);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{width:38px;height:50px;flex:none}

/* Mapa */
.mapa{position:relative}
.mapa svg.senda{position:absolute;inset:0;width:100%;height:100%}
.cielo-meta{position:absolute;left:0;right:0;top:0;text-align:center;padding:14px 10px}
.cielo-meta b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--oro);text-shadow:0 3px 0 var(--plomo)}
.cielo-meta span{color:var(--tenue);font-weight:700;font-size:.95rem}
.est-mapa{position:absolute;width:150px;margin-left:-75px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.medalla{
  width:78px;height:78px;border-radius:50%;position:relative;
  border:5px solid var(--plomo);box-shadow:0 0 0 3px var(--oro);
  font-family:var(--display);font-weight:800;font-size:1.9rem;color:var(--plomo);
  display:grid;place-items:center;
  background:conic-gradient(from 20deg,var(--g1) 0 25%,var(--g2) 0 50%,var(--g1) 0 75%,var(--g2) 0);
}
.medalla span{background:var(--pergamino);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--plomo)}
.est-mapa.cerrada .medalla{filter:grayscale(1) brightness(.6);box-shadow:none}
.est-mapa.actual .medalla{animation:latir 1.6s ease-in-out infinite}
.est-mapa .nom{font-family:var(--display);font-weight:800;font-size:1rem;line-height:1.1}
.est-mapa .tema{font-size:.82rem;color:var(--tenue);font-weight:700;line-height:1.15}
.est-mapa.cerrada .nom{color:var(--tenue)}
.estrellas{letter-spacing:2px;font-size:1.1rem;color:#4a4f99}
.estrellas i{font-style:normal;color:var(--oro)}
.est-mapa .yo{position:absolute;top:8px;width:46px;height:62px}
@keyframes latir{50%{transform:scale(1.08)}}

/* Nivel */
.cab{display:flex;align-items:center;gap:10px}
.cab h2{flex:1;font-size:1.35rem;color:var(--oro)}
.fases{display:flex;gap:6px;margin-top:10px}
.fases span{flex:1;text-align:center;font-weight:800;font-size:.8rem;padding:5px 2px;border-radius:999px;background:var(--plomo);color:var(--tenue);border:2px solid transparent}
.fases span.on{color:var(--tinta);background:var(--oro)}
.fases span.ok{border-color:var(--esmeralda);color:var(--esmeralda)}
.guia{display:flex;gap:10px;align-items:flex-start}
.guia svg{width:52px;height:52px;flex:none}
.guia .dice{flex:1;min-width:0}
.guia .dice p{font-weight:700}
.oir{margin-top:8px;font-weight:800;font-size:.9rem;color:var(--tinta);background:#f1dfae;border:2px solid var(--plomo);border-radius:999px;padding:4px 12px;min-height:36px}

/* Nivel 1: figura */
.figura{position:relative;width:min(100%,260px);aspect-ratio:240/360;margin:0 auto}
.figura svg{width:100%;height:100%;display:block}
.pt{
  position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  border:4px dashed rgba(255,255,255,.75);background:rgba(21,23,63,.25);
}
.pt.brilla{border-style:solid;border-color:var(--oro);animation:pulso 1s ease-in-out infinite}
.pt.hecho{border-style:solid;border-color:var(--oro);background:var(--oro);box-shadow:0 0 18px 6px rgba(246,196,69,.8)}
.pt.hecho.mini{background:transparent;box-shadow:none}
.pt.mal{animation:tiembla .35s}
.rot{position:absolute;transform:translate(-50%,30px);background:var(--plomo);color:var(--pergamino);border:2px solid var(--oro);border-radius:10px;padding:2px 7px;font-size:.72rem;font-weight:800;line-height:1.1;text-align:center;pointer-events:none}
.escena{position:relative;border:4px solid var(--plomo);border-radius:16px;overflow:hidden}
.escena svg{display:block;width:100%;height:auto}
.hs{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:3px dashed rgba(255,255,255,.85)}
.hs.vista{border:4px solid var(--oro);box-shadow:0 0 12px 3px rgba(246,196,69,.7)}
.hs.hecho{border:4px solid var(--esmeralda);background:rgba(47,191,143,.35)}
.rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.obj{background:#fff;color:var(--tinta);border:4px solid var(--plomo);border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:.85rem;line-height:1.1;min-height:96px}
.obj svg,.mesa svg{width:54px;height:54px}
.obj.vista{box-shadow:0 0 0 3px var(--oro)}
.obj.puesto{background:#c9f3e2;opacity:.8}
.mesa{background:#fff;color:var(--tinta);border:4px solid var(--plomo);border-radius:14px 14px 4px 4px;min-height:92px;padding:6px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;justify-content:center;font-weight:700}
.punto{display:inline-block;width:24px;height:24px;border-radius:50%;border:3px solid var(--plomo);vertical-align:middle;margin-right:10px;flex:none}
.frase.vista{box-shadow:0 0 0 3px var(--oro)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rueda{display:block;width:min(100%,280px);margin:0 auto}
.rueda path{cursor:pointer}
.cura{display:block;width:min(60%,190px);margin:0 auto}
.momento{text-align:center;font-family:var(--display);font-weight:800;font-size:1.35rem}
.ctas{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:center;background:var(--plomo);border-radius:16px;padding:14px}
.cta{width:20px;height:20px;border-radius:50%;background:#4a4f99;border:2px solid #8d90d6;flex:none}
.cta.grande{width:32px;height:32px}
.cta.gl{width:12px;height:12px;border-radius:3px}
.cta.cruz{width:auto;height:auto;border:0;background:none;font-size:1.9rem;line-height:1;color:#8d90d6;font-weight:800}
.cta.hecho{background:var(--oro);border-color:#fff3b0}
.cta.cruz.hecho{background:none;color:var(--oro)}
.cta.ahora{border-color:var(--oro);box-shadow:0 0 0 5px rgba(246,196,69,.55);animation:latir 1s ease-in-out infinite}
.cta.cruz.ahora{box-shadow:none;color:#fff}
.emo{display:block;font-size:3rem;line-height:1.15}
.obj .emo{font-size:2.6rem}
.globo{position:relative;width:min(100%,300px);aspect-ratio:1;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3f7fe0,#17357f);border:5px solid var(--plomo);box-shadow:0 0 0 4px var(--oro)}
.cont{position:absolute;transform:translate(-50%,-50%);min-width:86px;min-height:58px;padding:6px 8px;border:4px solid var(--plomo);font-family:var(--display);font-weight:800;font-size:.92rem;color:var(--plomo);background:var(--c);border-radius:46% 54% 50% 50%/55% 45% 55% 45%}
.cont.hecho{box-shadow:0 0 0 4px var(--oro),0 0 18px 8px rgba(246,196,69,.8)}
.colores-m{display:flex;flex-direction:column;gap:8px}
.colores-m p{display:flex;align-items:center;font-size:.95rem;font-weight:700}
.diploma{border:7px double #b8860b;text-align:center}
.diploma small{display:block;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8a6a12;font-size:.8rem}
.diploma .quien{font-family:var(--display);font-size:2rem;font-weight:800;color:#8a2b3d;overflow-wrap:anywhere;line-height:1.1;margin:6px 0}
.diploma p{font-weight:700}
.santo svg{width:150px;height:200px}
.cuenta{text-align:center;font-weight:800;color:var(--tenue);font-variant-numeric:tabular-nums}
.luz.chica{stroke-width:7}
h3.etapa{font-size:1.25rem;text-align:center;color:var(--pergamino)}
.exito{text-align:center}
.exito h3{font-size:1.4rem;color:#17795a;margin-bottom:4px}
@keyframes pulso{50%{box-shadow:0 0 0 12px rgba(246,196,69,.35)}}
@keyframes tiembla{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.luz{stroke:var(--oro);stroke-width:10;stroke-linecap:round;opacity:0;transition:opacity .4s;filter:drop-shadow(0 0 6px #fff3b0)}
.luz.on{opacity:1}
.palabras{min-height:2.6em;text-align:center;font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--oro)}
.pista{text-align:center;font-weight:700;color:var(--tenue);min-height:1.5em}

/* Nivel 2 */
.pieza{
  display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 12px;text-align:left;
  font-family:var(--display);font-weight:800;font-size:1.1rem;color:var(--plomo);
  background:var(--c);border:4px solid var(--plomo);border-radius:14px;
}
.pieza .n{width:30px;height:30px;flex:none;border-radius:50%;background:var(--pergamino);display:grid;place-items:center;font-size:.95rem;border:2px solid var(--plomo)}
.pieza.vista{box-shadow:0 0 0 3px var(--oro)}
.pieza.fija{box-shadow:0 0 0 3px var(--esmeralda)}
.hueco{min-height:54px;border:4px dashed #5b61b8;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--tenue);font-weight:800}
.fila{display:flex;flex-direction:column;gap:8px}
.bolsa{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:3px dashed #5b61b8}
.frase{width:100%;text-align:left;min-height:54px;padding:10px 14px;font-weight:800;color:var(--tinta);background:#fff;border:4px solid var(--plomo);border-radius:14px}
.oracion p{font-weight:700;margin-bottom:4px}
.oracion em{font-style:normal;font-family:var(--display);font-weight:800;color:#8a2b3d}
h3.et{font-size:1.05rem;color:var(--tenue)}

/* Ganar */
.gana{text-align:center}
.gana .big{font-size:3.4rem;letter-spacing:6px;color:#4a4f99}
.gana .big i{font-style:normal;color:var(--oro);display:inline-block;animation:salta .5s both}
.gana .big i:nth-child(2){animation-delay:.2s}.gana .big i:nth-child(3){animation-delay:.4s}
@keyframes salta{from{transform:scale(0) rotate(-40deg)}}
.gana h2{font-size:1.9rem;color:var(--oro)}
.insignia{display:inline-flex;align-items:center;gap:10px;background:var(--plomo);border:3px solid var(--oro);border-radius:999px;padding:8px 18px;font-family:var(--display);font-weight:800}
.insignia b{width:26px;height:26px;border-radius:50%;background:var(--c)}

/* Opciones de repaso */
.opc{width:100%;min-height:54px;padding:10px 14px;font-weight:800;text-align:left;color:var(--tinta);background:#fff;border:4px solid var(--plomo);border-radius:14px}
.opc.mal{background:#ffd0d6;border-color:var(--rubi);box-shadow:0 0 0 3px var(--rubi);animation:tiembla .35s}
.opc.mal::after{content:" ✗";color:var(--rubi);font-weight:800}
.errada{background:#ffd0d6!important;border-color:var(--rubi)!important;box-shadow:0 0 0 3px var(--rubi)!important;animation:tiembla .35s}
.errada::after{content:" ✗";color:var(--rubi);font-weight:800}
.hs.errada,.pt.errada{background:rgba(226,69,95,.6)!important;display:grid;place-items:center}
.hs.errada::after,.pt.errada::after{content:"✗";color:#fff;font-size:1.5rem}
.acierto{background:#c9f3e2!important;box-shadow:0 0 0 3px var(--esmeralda)!important}
.acierto::after{content:" ✓";color:#17795a;font-weight:800}
.tag-pista{display:inline-block;background:var(--rubi);color:#fff;border-radius:999px;padding:1px 10px;margin-right:6px;font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.guia.es-pista{background:#fff0b8;box-shadow:0 0 0 4px var(--rubi);animation:llama .5s}
.pista.caja{background:#fff0b8;color:var(--tinta);border:3px solid var(--rubi);border-radius:14px;padding:10px 12px;text-align:left;animation:llama .5s}
.entra{animation:entra .35s ease-out}
@keyframes llama{0%{transform:scale(.95)}60%{transform:scale(1.03)}}
@keyframes entra{from{opacity:0;transform:translateX(28px)}}
.opc.bien{background:#c9f3e2}

/* Mochila y aviso */
.capa{position:absolute;inset:0;background:rgba(10,11,34,.8);display:flex;align-items:flex-end;z-index:5}
.capa .hoja{width:100%;max-height:85%;overflow-y:auto;border-radius:24px 24px 0 0;border-bottom:0}
.capa h2{font-size:1.5rem;margin-bottom:10px}
.item{display:flex;gap:12px;padding:12px 0;border-top:2px solid #e2d3a6}
.item b.c{width:36px;height:36px;border-radius:50%;flex:none;background:var(--c);border:3px solid var(--plomo)}
.item.no{opacity:.5}
.item h3{font-size:1.05rem}
.item p{font-size:.95rem}
#aviso{position:absolute;left:16px;right:16px;bottom:18px;z-index:9;background:var(--plomo);border:3px solid var(--oro);border-radius:14px;padding:12px 14px;font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#aviso.on{opacity:1}
.ilus{display:block;width:130px;height:130px;object-fit:contain;margin:0 auto 6px;border-radius:12px;background:#fff}
.obj .ilus{width:96px;height:96px}
#view.juego{padding:0;overflow:hidden;display:flex;flex-direction:column}
#app.enjuego #aviso{bottom:122px}
.mundo{position:relative;flex:1;min-height:440px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.mundo canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:8px;align-items:center}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pixel{font-family:"Pixelify Sans",var(--display)!important;letter-spacing:.02em}
.retrato{width:72px;height:96px;flex:none;object-fit:contain;image-rendering:pixelated;background:#cfe8b0;border:3px solid var(--plomo);border-radius:10px}
.mundo canvas{image-rendering:pixelated}
.gracia{flex:1;min-width:0;height:34px;position:relative;overflow:hidden;background:var(--plomo);border:3px solid var(--oro);border-radius:999px}
.gracia i{position:absolute;left:0;top:0;bottom:0;width:60%;background:linear-gradient(90deg,#f6c445,#fff3b0);transition:width .3s}
.gracia span{position:relative;display:block;text-align:center;line-height:28px;font-weight:800;font-size:.9rem;color:var(--tinta);text-shadow:0 0 4px #fff}
.gracia.baja i{background:linear-gradient(90deg,#e2455f,#f08ba0)}
.hud2{flex:1;min-width:0;background:rgba(10,11,34,.82);border:2px solid var(--oro);border-radius:12px;padding:4px 10px;font-weight:800;font-size:.85rem;pointer-events:none}
.rezar{position:absolute;right:14px;bottom:18px;width:88px;height:88px;border-radius:18px;background:var(--oro);color:var(--tinta);border:5px solid var(--plomo);border-bottom-width:9px;font-family:var(--display);font-weight:800;font-size:1.05rem}
.rezar:active{transform:translateY(3px)}
.rezar[disabled]{opacity:.55}
.ayuda10{position:absolute;left:12px;bottom:22px;right:116px;font-weight:800;font-size:.95rem;color:var(--pergamino);text-shadow:0 2px 0 var(--plomo),0 0 6px var(--plomo);pointer-events:none}
#modal10:empty{display:none}
.capa10{position:absolute;inset:0;z-index:4;background:rgba(10,11,34,.72);display:flex;align-items:flex-end;padding:10px}
.capa10 > .hoja{width:100%;max-height:94%;overflow-y:auto}
.capa10 .guia{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:6px}
.como p{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.como b.ico{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--plomo);display:grid;place-items:center;font-size:.9rem;color:var(--plomo)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="barra"></div>
  <main id="view"></main>
  <div id="capa"></div>
  <div id="aviso" role="status"></div>
</div>

<script>
/* ========= CONTENIDO EDITABLE POR EL CATEQUISTA ========= */
const NIVELES = [
  {n:1, lugar:'La puerta del templo', tema:'La señal de la cruz', g:['#58b7f0','#f6c445'], insignia:'Cruz de luz', listo:true, logro:'Ya sabes signarte, santiguarte y persignarte.',
   repaso:'Signarse es hacer tres cruces pequeñas con el pulgar: en la frente, en la boca y en el pecho. Santiguarse es hacer una cruz grande, de la frente al pecho y del hombro izquierdo al derecho, diciendo: En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén. Persignarse es signarse y santiguarse, una cosa después de la otra.'},
  {n:2, lugar:'El rincón de oración', tema:'Partes de la oración', g:['#e2455f','#f6c445'], insignia:'Vela encendida', listo:true, logro:'Puedes rezar esta oración hoy antes de dormir.',

const imgEv = id => ILUS['ev-'+id] ? `<img class="ilus" src="${ILUS['ev-'+id]}" alt="">` : '';
const TUNICAS = ['#e2455f','#58b7f0','#2fbf8f','#f6c445','#9b6bf2'];

/* ========= ESTADO ========= */
const CLAVE = 'caminoDeSantos.v1';
let S = {name:'', color:TUNICAS[0], stars:{}};
let L = null;          // estado del nivel en curso
let pantalla = 'inicio';
const $ = s => document.querySelector(s);
const view = $('#view'), barra = $('#barra'), capa = $('#capa');
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} }
function leer(){ try{ return JSON.parse(localStorage.getItem(CLAVE)) || {}; }catch(e){ return {}; } }
function mezclar(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function totalEstrellas(){ return Object.values(S.stars).reduce((a,b)=>a+b,0); }
function abierto(n){ const nv=NIVELES[n-1]; return !!nv.listo && (n===1 || S.stars[n-1]>0); }
function nivelActual(){ for(const nv of NIVELES){ if(nv.listo && !S.stars[nv.n]) return nv.n; } return NIVELES.filter(v=>v.listo).pop().n; }

let tAviso;
function aviso(t,ms){ const a=$('#aviso'); a.textContent=t; a.classList.add('on'); clearTimeout(tAviso); tAviso=setTimeout(()=>a.classList.remove('on'),ms||Math.max(2200,t.length*55)); }
const puedeHablar = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function decir(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='es-MX'; u.rate=.95; speechSynthesis.speak(u); }catch(e){} }

/* ========= DIBUJOS ========= */
function avatar(color, cls){
  return `<svg class="${cls||''}" viewBox="0 0 120 160" aria-hidden="true">
    ${S.stars&&S.stars[10]?'<ellipse cx="60" cy="9" rx="25" ry="6" fill="none" stroke="#f6c445" stroke-width="5"/>':''}
    <path d="M26 156 Q26 84 60 84 Q94 84 94 156 Z" fill="${color}" stroke="#0a0b22" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="60" cy="50" r="31" fill="#f0c49a" stroke="#0a0b22" stroke-width="5"/>
    <path d="M29 48 Q30 16 60 16 Q90 16 91 48 Q76 30 60 33 Q44 30 29 48Z" fill="#4a2c1a" stroke="#0a0b22" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="49" cy="54" r="4" fill="#0a0b22"/><circle cx="71" cy="54" r="4" fill="#0a0b22"/>
    <path d="M49 66 Q60 75 71 66" fill="none" stroke="#0a0b22" stroke-width="4" stroke-linecap="round"/>
  </svg>`;
}
const ANGEL = `<svg viewBox="0 0 60 60" aria-hidden="true">
  <path d="M30 34 Q6 14 6 40 Q16 44 30 40 Q44 44 54 40 Q54 14 30 34Z" fill="#fff" stroke="#0a0b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M19 56 Q19 34 30 34 Q41 34 41 56Z" fill="#58b7f0" stroke="#0a0b22" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="30" cy="24" r="11" fill="#f0c49a" stroke="#0a0b22" stroke-width="3"/>
  <ellipse cx="30" cy="8" rx="11" ry="3.5" fill="none" stroke="#e0a300" stroke-width="3"/>
  <circle cx="26" cy="24" r="1.8" fill="#0a0b22"/><circle cx="34" cy="24" r="1.8" fill="#0a0b22"/>
</svg>`;
function guia(texto){
  return `<div class="hoja guia">${ANGEL}<div class="dice"><p id="guiaTxt">${texto}</p>
    ${puedeHablar?'<button class="oir" data-act="oir" type="button">Escuchar</button>':''}</div></div>`;
}
function estrellas(n){ return `<span class="estrellas" aria-label="${n} de 3 estrellas">${'<i>★</i>'.repeat(n)}${'★'.repeat(3-n)}</span>`; }
function cabecera(nv, fase){
  const f=['Descubre','Juega','Gana'];
  return `<div><div class="cab"><button class="btn sec chico" data-act="mapa" type="button">Mapa</button><h2>${nv.n}. ${nv.tema}</h2></div>
    <div class="fases">${f.map((t,i)=>`<span class="${i===fase?'on':i<fase?'ok':''}">${t}</span>`).join('')}</div></div>`;
}

/* ========= PANTALLAS ========= */
function pintarBarra(){
  view.classList.toggle('juego', pantalla==='mundo'); $('#app').classList.toggle('enjuego', pantalla==='mundo');
  if(pantalla==='inicio'){ barra.innerHTML=''; return; }
  barra.innerHTML = `<div class="barra">${avatar(S.color,'mini')}<div class="quien">${esc(S.name)}</div>
    <div class="est">★ ${totalEstrellas()}</div>
    <button class="btn chico" data-act="mochila" type="button">Mochila</button></div>`;
}

function inicio(){
  pantalla='inicio'; pintarBarra();
  view.innerHTML = `<div class="pila">
    <h1 class="titulo">Pequeños Misioneros</h1>
    <p class="sub">Un camino para aprender y llegar al cielo</p>
    <div class="vitral" id="prev">${avatar(S.color).replace('<svg ','<svg style="width:130px;height:172px" ')}</div>
    <form class="hoja pila" id="fInicio">
      <div><label class="campo" for="nombre">¿Cómo se llama tu personaje?</label>
        <input type="text" id="nombre" maxlength="16" autocomplete="off" placeholder="Escribe un nombre" value="${esc(S.name)}"></div>
      <div><span class="campo">Elige el color de su túnica</span>
        <div class="colores">${TUNICAS.map((c,i)=>`<button type="button" class="color" id="col${i}" data-act="color" data-c="${c}" style="background:${c}" aria-pressed="${c===S.color}" aria-label="Color ${i+1}"></button>`).join('')}</div></div>
      <button class="btn" type="submit">Empezar el camino</button>
    </form></div>`;
  $('#fInicio').addEventListener('submit', e=>{
    e.preventDefault();
    const n=$('#nombre').value.trim();
    if(!n){ aviso('Primero escribe el nombre de tu personaje'); $('#nombre').focus(); return; }
    S.name=n; guardar(); mapa();
  });
}

function mapa(){
  pantalla='mapa'; L=null; pintarBarra();
  const paso=132, arriba=150, alto=arriba+NIVELES.length*paso+10, act=nivelActual();
  const pos=i=>({x:i%2?68:32, y:arriba+(NIVELES.length-1-i)*paso+40});
  let d='';
  NIVELES.forEach((_,i)=>{ const p=pos(i); if(!i){ d=`M${p.x} ${p.y}`; } else { const q=pos(i-1), m=(q.y+p.y)/2; d+=` C${q.x} ${m} ${p.x} ${m} ${p.x} ${p.y}`; } });
  view.innerHTML = `<div class="mapa" style="height:${alto}px">
    <svg class="senda" viewBox="0 0 100 ${alto}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${d}" fill="none" stroke="#f6c445" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".7"/></svg>

/* --- fondo del mundo (pasto, arena, agua, caminos y puentes) --- */
function hash2(x,y){ let h=x*374761393+y*668265263; h=(h^(h>>>13))*1274126177; return ((h^(h>>>16))>>>0)/4294967296; }
function ruido(x,y,s){ const gx=Math.floor(x/s), gy=Math.floor(y/s), fx=x/s-gx, fy=y/s-gy, u=fx*fx*(3-2*fx), v=fy*fy*(3-2*fy);
  const a=hash2(gx,gy), b=hash2(gx+1,gy), c=hash2(gx,gy+1), d=hash2(gx+1,gy+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function crearFondo(){
  const W=W10.ancho/AP, H=W10.alto/AP, cv=lienzo(W,H), ctx=cv.getContext('2d'), im=ctx.createImageData(W,H), d=im.data;
  const tipo=new Uint8Array(W*H); // 0 agua,1 arena,2 borde,3 pasto,4 camino,5 puente,6 baranda
  const islaIdx=new Int8Array(W*H).fill(-1), c=ISLAS10[0];
  const segs=PUENTES.map(id=>{ const i=isla10(id); return [c.x,c.y,i.x,i.y,id]; });
  const col=(o,rgb)=>{ d[o*4]=rgb[0]; d[o*4+1]=rgb[1]; d[o*4+2]=rgb[2]; d[o*4+3]=255; };
  const AGUA=rgbDe('#2e6fc4'), AGUA2=rgbDe('#4f97df'), ESP=rgbDe('#cfeaff'), ARENA=rgbDe('#e8cf8a'), ARENA2=rgbDe('#d4b46a'),
        TIERRA=rgbDe('#c49a5c'), TIERRA2=rgbDe('#a67c44'), TABLA=rgbDe('#b98450'), TABLA2=rgbDe('#d3a06a'), GRIETA=rgbDe('#6b4423'), BAR=rgbDe('#5b3a1e'), LINEA=rgbDe('#1f3a1c');
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const o=y*W+x, wx=x*AP+1, wy=y*AP+1; let t=0, ii=-1, cerca=false;
    ISLAS10.forEach((i,k)=>{ const a=(wx-i.x)/i.rx, b=(wy-i.y)/i.ry, g=a*a+b*b;
      if(g<=.93*.93){ t=3; ii=k; } else if(g<=1 && t<2){ t=2; ii=k; }
      else { const a2=(wx-i.x)/(i.rx+14), b2=(wy-i.y)/(i.ry+14); if(a2*a2+b2*b2<=1 && t<1){ t=1; ii=k; }
        const a3=(wx-i.x)/(i.rx+40), b3=(wy-i.y)/(i.ry+40); if(a3*a3+b3*b3<=1) cerca=true; } });
    if(t===3){ for(const s of segs){ const ds=distSeg(wx,wy,s[0],s[1],s[2],s[3]); if(ds<13 && (ii===0 || ISLAS10[ii].id===s[4])){ t=4; break; } } }
    if(t<3){ for(const s of segs){ const ds=distSeg(wx,wy,s[0],s[1],s[2],s[3]); if(ds<27){ t = ds>22 ? 6 : 5;
        if(t===5){ const L0=Math.hypot(s[2]-s[0],s[3]-s[1]), along=((wx-s[0])*(s[2]-s[0])+(wy-s[1])*(s[3]-s[1]))/L0; islaIdx[o]=(Math.floor(along/AP)%7===0)?1:0; } break; } } }
    tipo[o]=t; if(t>=2&&t<=4) islaIdx[o]=ii;
    const h=hash2(x,y);
    if(t===0) col(o, cerca ? (h<.04?ESP:AGUA2) : ((x+y*3)%29===0&&h<.6 ? AGUA2 : AGUA));
    else if(t===1) col(o, h<.12?ARENA2:ARENA);
    else if(t===2){ const p=ISLAS10[ii].pasto.map(rgbDe); col(o, tono(p[0],-.15)); }
    else if(t===3){ const p=ISLAS10[ii].pasto.map(rgbDe), n=ruido(x,y,22)+ruido(x+99,y+33,7)*.35; col(o, n>.92?p[2]:n<.42?tono(p[1],-.06):p[1]); }
    else if(t===4) col(o, h<.06?TIERRA2:h>.97?TABLA2:TIERRA);
    else if(t===5) col(o, islaIdx[o]===1?GRIETA:(h<.1?TABLA2:TABLA));
    else col(o, BAR);
  }
  // contornos: borde del pasto, espuma del agua y bordes del camino
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){
    const o=y*W+x, t=tipo[o], n=[tipo[o-1],tipo[o+1],tipo[o-W],tipo[o+W]];
    if(t===2 && n.includes(1)) col(o,LINEA);
    else if(t===0 && n.includes(1)) col(o,ESP);
    else if(t===4 && n.includes(3)) col(o,TIERRA2);
    else if(t===1 && n.includes(0) && hash2(x,y)<.5) col(o,ARENA2);
  }
  ctx.putImageData(im,0,0);
  // matas de pasto y flores
  const r=rng(77);
  for(let k=0;k<5200;k++){ const x=Math.floor(r()*W), y=Math.floor(r()*H), o=y*W+x; if(tipo[o]!==3) continue;
    const p=ISLAS10[islaIdx[o]].pasto;
    if(r()<.82){ px(ctx,p[0],x,y); px(ctx,p[0],x+2,y); px(ctx,p[0],x+1,y+1); px(ctx,p[2],x+1,y-1); }
    else { const f=['#f08ba0','#ffffff','#9bb7ff','#f6c445'][Math.floor(r()*4)]; px(ctx,f,x,y,2,2); px(ctx,'#ffffff',x,y); px(ctx,p[0],x,y+2,2,1); } }
  return {cv, tipo, W, H};
}

function sumar(n){ M.gracia=Math.max(0,Math.min(100,M.gracia+n)); }

const faltan10 = id => M.perg.filter(x=>x.isla===id&&!x.hecho).length;

function actualizar10(dt){
  const j=M.jug; M.t+=dt; if(M.cdRezar>0) M.cdRezar-=dt; if(M.inv>0) M.inv-=dt;
  let ix=0, iy=0;
  if(M.joy){ ix=M.joy.dx/50; iy=M.joy.dy/50; }
  if(TECLAS.has('ArrowLeft')||TECLAS.has('a')) ix-=1; if(TECLAS.has('ArrowRight')||TECLAS.has('d')) ix+=1;
  if(TECLAS.has('ArrowUp')||TECLAS.has('w')) iy-=1; if(TECLAS.has('ArrowDown')||TECLAS.has('s')) iy+=1;
  const len=Math.hypot(ix,iy); if(len>1){ ix/=len; iy/=len; }
  if(len>.15){
    const v=170, nx=j.x+ix*v*dt, ny=j.y+iy*v*dt;
    if(caminable(nx,j.y)) j.x=nx; if(caminable(j.x,ny)) j.y=ny;
    j.paso+=dt*9; j.mov=true;
    if(!M.movio){ M.movio=true; const a=$('#ayuda10'); if(a) a.textContent=''; }
  } else j.mov=false;
  // salir de un continente sin terminar la misión
  const isl=islaDe(j.x,j.y);
  if(isl){ if(isl!=='centro'){ M.ultPos={x:j.x,y:j.y}; } M.ultIsla=isl; }
  else if(M.ultIsla && M.ultIsla!=='centro'){ const id=M.ultIsla; M.ultIsla=null; if(!M.hechos[id]){ avisoSalida10(id); return; } }
  const cx=j.x, cy=j.y-20;
  M.frutos.forEach(f=>{
    if(!f.on){ f.resp-=dt; if(f.resp<=0) f.on=true; return; }
    if(Math.hypot(f.x-cx,f.y-10-cy)<30){ f.on=false; f.resp=25; sumar(12); flot('+'+f.n, '#fff3b0');
      if(!M.vioFruto){ M.vioFruto=true; aviso(`Ese es un fruto del Espíritu Santo: ${f.n}. Los frutos llenan tus corazones de gracia.`); } }
  });
  M.pecados.forEach(p=>{
    if(!p.vivo){ if(M.hechos[p.isla]) return; p.resp-=dt;
      if(p.resp<=0){ const q=puntoEn(isla10(p.isla), Math.random, [{x:j.x,y:j.y}], 230); if(q){ p.x=q.x; p.y=q.y; p.vivo=true; p.meta=null; } } return; }
    const i=isla10(p.isla), d=Math.hypot(j.x-p.x,j.y-p.y);
    let tx, ty, vel;
    if(d<200 && islaDe(j.x,j.y)===p.isla){ tx=j.x; ty=j.y; vel=58; }
    else { if(!p.meta||Math.hypot(p.meta.x-p.x,p.meta.y-p.y)<10){ const a=Math.random()*6.28, rr=Math.sqrt(Math.random())*.75; p.meta={x:i.x+Math.cos(a)*i.rx*rr, y:i.y+Math.sin(a)*i.ry*rr}; }
      tx=p.meta.x; ty=p.meta.y; vel=34; }
    const dd=Math.hypot(tx-p.x,ty-p.y)||1, nx=p.x+(tx-p.x)/dd*vel*dt, ny=p.y+(ty-p.y)/dd*vel*dt;
    if(enIsla(i,nx,ny,.84)){ p.x=nx; p.y=ny; } else p.meta=null;
    if(d<32 && M.inv<=0) golpe10(p);
  });
  if(M.pausa) return;
  if(!M.actual) for(const p of M.perg){ if(!p.hecho && Math.hypot(p.x-cx,p.y-8-cy)<32){ abrirPregunta10(p); return; } }
  for(const n of M.ninos){ const d=Math.hypot(n.x-j.x,n.y-j.y);
    if(d<56 && M.cerca!==n.id){ M.cerca=n.id;
      if(!M.saludo[n.id] || (!M.hechos[n.id] && faltan10(n.id)===0)){ dialogo10(n.id); return; } }

  const k=Math.max(2,Math.round(DW/210)), FW=Math.ceil(DW/k), FH=Math.ceil(DH/k), s=k/dpr; // s: px de pantalla por pixel del dibujo

        <p>${s?nv.repaso:'Completa el nivel '+nv.n+' para ganarla.'}</p></div></div>`; }).join('')}
    <div class="pila" style="margin-top:12px">
      <button class="btn" type="button" data-act="cerrarBtn">Cerrar</button>
      <button class="btn sec chico" type="button" data-act="reiniciar" style="align-self:center">Empezar de nuevo</button></div>
  </div></div>`;
}

/* ========= TOQUES ========= */
function manejar(e,b,a,d){
  if(a==='cerrar'){ if(e.target===b) capa.innerHTML=''; return; }
  if(a==='cerrarBtn'){ capa.innerHTML=''; return; }
  if(a==='reiniciar'){ S={name:'',color:TUNICAS[0],stars:{}}; guardar(); capa.innerHTML=''; inicio(); return; }
  if(a==='mochila'){ mochila(); return; }
  if(a==='oir'){ const t=$('#guiaTxt'); if(t) decir(t.textContent); return; }
  if(a==='color'){ S.color=d.c; document.querySelectorAll('.color').forEach(x=>x.setAttribute('aria-pressed', x===b));
    $('#prev').innerHTML=avatar(S.color).replace('<svg ','<svg style="width:130px;height:172px" '); return; }
  if(a==='mapa'){ mapa(); return; }
  if(a==='nivel'){ entrar(+d.n); return; }
  if(a==='otra'||a==='pasar'){ iniciar(+d.n); return; }
  if(a==='opc'){ const o=L.ops[+d.i];
    if(o.ok){ b.classList.add('bien'); document.querySelectorAll('.opc').forEach(x=>x.disabled=true); $('#pista').textContent='';
      $('#exito').innerHTML=`<div class="hoja exito pila"><div><h3>¡Respuesta correcta!</h3><p>Muy bien, ${esc(S.name)}. La puerta se abrió.</p></div>
        <button class="btn" type="button" id="pasar" data-act="pasar" data-n="${L.n}">Entrar al nivel ${L.n}</button></div>`;
      $('#pasar').scrollIntoView({block:'nearest'}); $('#pasar').focus(); }
    else { b.classList.remove('mal'); void b.offsetWidth; b.classList.add('mal'); $('#pista').innerHTML='<span class="tag-pista">Pista</span>'+esc(L.q.pista); $('#pista').className='pista caja'; }
    return; }
  if(a==='pt'){ tocarN1(+d.i); return; }
  if(a==='hs'){ tocarN3(d.id); return; }
  if(a==='obj'){ tocarN4(d.id); return; }
  if(a==='aJugar3'){ L.fase=1; pintarN3(); return; }
  if(a==='aJugar4'){ L.fase=1; pintarN4(); return; }
  if(a==='ver5'){ L.vistas[d.id]=true; const m=parteMisa(d.id); pintarN5(`<b>${m.nombre}.</b> ${m.explica} Aquí van: ${m.momentos}`); return; }
  if(a==='aJugar5'){ L.fase=1; pintarN5(); return; }
  if(a==='poner5'){ const h=L.huecos.indexOf(null); if(h<0) return; L.huecos[h]=d.id; L.bolsa=L.bolsa.filter(x=>x!==d.id); pintarN5(); return; }
  if(a==='quitar5'){ const i=+d.i; L.bolsa.push(L.huecos[i]); L.huecos[i]=null; pintarN5(); return; }
  if(a==='revisar5'){ revisarN5(); return; }
  if(a==='clas'){ clasificarN5(d.id); return; }
  if(a==='tiempo'){ if(!L||L.n!==6||L.fase!==0) return; L.vistas[d.id]=true; L.sel=d.id; const t=tiempo(d.id);
    pintarN6(`<b>${t.nombre}.</b> ${t.explica} Su color es el ${COLORES[t.color].nombre.toLowerCase()}: ${COLORES[t.color].pista}`); return; }
  if(a==='aJugar6'){ L.fase=1; pintarN6(); return; }
  if(a==='casulla'){ vestirN6(d.c); return; }
  if(a==='sig6'){ L.i++; L.ok=false; if(L.i>=L.cola.length) ganar(6, estrellasPor(L.errores)); else pintarN6(); return; }
  if(a==='elige'){ elegir(d.id); return; }
  if(a==='ver7'){ L.vistas[d.id]=true; const m=ROSARIO.find(x=>x.id===d.id); pintarN7(`<b>Misterios ${m.nombre.toLowerCase()}.</b> Se rezan los días ${m.dias}. Son: ${m.lista.join('; ')}.`); return; }
  if(a==='aJugar7'){ L.fase=1; pintarN7(); return; }
  if(a==='reza'){ rezarN7(d.o); return; }
  if(a==='ver8'){ L.vistas[d.id]=true; const v=EVANGELISTAS.find(x=>x.id===d.id); pintarN8(`<b>San ${v.nombre}.</b> ${v.explica}`); return; }
  if(a==='aJugar8'){ L.fase=1; elige({intro:'¿Quién es? Mira el símbolo o lee la pista y toca al evangelista correcto.', cola:mezclar(PREG_EVANGELISTAS).map(q=>Object.assign({},q,{t:q.t.replace(/<span class="emo">(.+?)<\/span>/,(m0,e)=>{ const v=EVANGELISTAS.find(x=>x.emo===e); return (v&&imgEv(v.id))||m0; })})), ops:EVANGELISTAS.map(v=>({id:v.id, nombre:'San '+v.nombre, c:v.c})), fin:()=>ganar(8, estrellasPor(L.errores))}); return; }
  if(a==='ver9'){ L.vistas[d.id]=true; const x=SACRAMENTOS.find(y=>y.id===d.id), g=grupo(x.g); pintarN9(`<b>${x.nombre}.</b> ${x.explica} Su signo: ${x.signo.charAt(0).toLowerCase()+x.signo.slice(1)}. Es un sacramento de ${g.nombre.toLowerCase()}: ${g.d}.`); return; }
  if(a==='aJugar9'){ jugarN9(); return; }
  if(a==='aJugar10'){ mundo10(); return; }
  if(a==='rezar10'){ rezar10(); return; }
  if(a==='q10'){ responder10(+d.i); return; }
  if(a==='quedarse10'){ quedarse10(d.id); return; }
  if(a==='cerrar10'){ modal10(''); if(M&&M.puerta) aviso('Camina hasta la puerta de la iglesia del centro.'); return; }
  if(a==='confesar10'){ M.caidas++; M.jug.x=M.confes.x; M.jug.y=M.confes.y+48; M.gracia=100; M.enConf=true; modal10(''); aviso('Dios te perdonó. ¡Tu gracia está llena otra vez!'); return; }
  if(a==='ver'){ L.vistas[d.id]=true; const o=parte(d.id); pintarN2(`<b>${o.nombre}.</b> ${o.explica}`); return; }
  if(a==='aJugar'){ L.fase=1; pintarN2(); return; }
  if(a==='poner'){ const s=L.huecos.indexOf(null); if(s<0) return; L.huecos[s]=d.id; L.bolsa=L.bolsa.filter(x=>x!==d.id); pintarN2(); return; }
  if(a==='quitar'){ const i=+d.i; L.bolsa.push(L.huecos[i]); L.huecos[i]=null; pintarN2(); return; }
  if(a==='revisar'){ revisarN2(); return; }
  if(a==='frase'){ const f=ORACION[L.i].frases[+d.i]; L.elegidas.push(L.i===1 ? L.elegidas.pop()+' '+f : f); L.i++;
    if(L.i>=ORACION.length) ganar(2, L.errores===0?3:L.errores<=3?2:1); else pintarN2(); return; }
}
const CON_ENTRADA=['sig6','frase','cont','nivel','otra','pasar','mapa','aJugar','aJugar3','aJugar4','aJugar5','aJugar6','aJugar7','aJugar8','aJugar9'];
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, d=Object.assign({}, b.dataset);
  const ref=L, antes=(L&&typeof L.errores==='number')?L.errores:null;
  manejar(e,b,a,d);
  if(L && L===ref && antes!==null && L.errores>antes){
    // respuesta equivocada: marcar en rojo y resaltar la pista
    if(a!=='revisar' && a!=='revisar5'){
      let sel=`[data-act="${a}"]`;
      ['id','i','c','o'].forEach(k=>{ if(d[k]!==undefined) sel+=`[data-${k}="${d[k]}"]`; });
      const el=view.querySelector(sel);
      if(el){ el.classList.add('errada'); if(a==='pt') setTimeout(()=>el.classList.remove('errada'),900); }
    }
    if(a==='pt'){ const ps=$('#pista'); if(ps){ ps.classList.remove('caja'); void ps.offsetWidth; ps.classList.add('caja'); ps.insertAdjacentHTML('afterbegin','<span class="tag-pista">Pista</span>'); } }
    else { const g=view.querySelector('.guia'), t=$('#guiaTxt');
      if(g&&t){ g.classList.add('es-pista'); t.innerHTML=t.innerHTML.replace(/Pista: /,''); t.insertAdjacentHTML('afterbegin','<span class="tag-pista">Pista</span>'); g.scrollIntoView({block:'nearest',behavior:'smooth'}); } }
  } else {
    if(a==='pt'){ const ps=$('#pista'); if(ps && !ps.textContent) ps.classList.remove('caja'); }
    if(CON_ENTRADA.includes(a) && view.firstElementChild) view.firstElementChild.classList.add('entra');
  }
});

/* ========= ARRANQUE ========= */
function start(data){
  S=Object.assign(S, leer(), data && data.name ? data : {});
  if(!S.stars) S.stars={};
  if(S.name) mapa(); else inicio();
}
try{ window.claude?.hot?.snapshot?.(()=>S); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
